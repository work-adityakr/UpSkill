apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upskill-backend-hpa
  namespace: upskill-namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upskill-backend-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
